# Local development only. Separate volumes/ports preserve historical databases.
name: chix-local
services:
  setup:
    image: node:24-alpine
    command: ["node", "/scripts/local-config.mjs", "/config"]
    volumes:
      - ./scripts/local-config.mjs:/scripts/local-config.mjs:ro
      - ./.local:/config
  postgres:
    image: postgres:16-alpine
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: chix_local_owner
      POSTGRES_DB: chalkline
      POSTGRES_PASSWORD_FILE: /config/owner-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - local_postgres:/var/lib/postgresql/data
      - ./.local:/config:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chix_local_owner -d chalkline"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    depends_on:
      setup:
        condition: service_completed_successfully
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$$(cat /config/redis-password)"',
      ]
    ports:
      - "127.0.0.1:56380:6379"
    volumes:
      - local_redis:/data
      - ./.local:/config:ro
volumes:
  local_postgres:
  local_redis:
